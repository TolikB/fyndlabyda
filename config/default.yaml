# Local defaults; explicit environment variables always win.
app:
  environment: development
  log_level: INFO
  run_mode: api
  market_data_mode: live_public
  execution_mode: paper
bybit:
  base_url: https://api.bybit.com
  websocket_url: wss://stream.bybit.com/v5/public/linear
gate:
  base_url: https://api.gateio.ws/api/v4
  websocket_url: wss://fx-ws.gateio.ws/v4/ws/usdt
  settle: usdt
okx:
  base_url: https://www.okx.com
  websocket_url: wss://ws.okx.com:8443/ws/v5/public
  funding_symbol_limit: 30
binance:
  spot_base_url: https://api.binance.com
  futures_base_url: https://fapi.binance.com
  websocket_url: wss://fstream.binance.com/ws
hyperliquid:
  base_url: https://api.hyperliquid.xyz
  websocket_url: wss://api.hyperliquid.xyz/ws
scanner:
  minimum_net_apr: 0.10
  minimum_liquidity_score: 70
  maximum_slippage_percent: 0.15
  maximum_spread_percent: 0.20
  minimum_funding_samples: 20
  minimum_opportunity_duration_seconds: 30
paper_runner:
  series_file: config/paper_series.yaml
  autotrade: false
  loop_interval_seconds: 15
  confirmation_seconds: 60
  book_depth: 50
  max_book_age_seconds: 10
  auto_init_database: false
telegram:
  enabled: false
  api_base_url: https://api.telegram.org
  timezone: Europe/Kyiv
  report_hour: 0
  report_minute: 5
