schema_version: 1
specification:
  title: Automated Multi-Regime Crypto Trading System
  version: "1.0"
  date: "2026-08-15"
release:
  name: V1
  all_scope_single_v1: true
  includes_original_v1: true
  includes_original_exclusions: true
  includes_original_v2: true
  deferred_releases: []
  default_mode: SAFE_MODE
safety:
  explicit_live_authorization_required: true
  private_credentials_forbidden_in_ci: true
  real_orders_forbidden_by_default: true
  withdrawals_forbidden_by_default: true
  dangerous_capabilities:
    - automated_withdrawals
    - dex_execution
    - grid_averaging
    - live_llm_decisions
    - live_rl_decisions
    - loss_averaging
    - martingale
    - mev_execution
  dangerous_capabilities_default_enabled: false
required_modes:
  - BACKTEST
  - REPLAY
  - SHADOW
  - PAPER
  - LIMITED_LIVE
  - LIVE
  - SAFE_MODE
quality_gates:
  overall_coverage_percent: 85
  critical_coverage_percent: 95
  out_of_sample_profit_factor_min: 1.25
  out_of_sample_expectancy_r_min: 0.15
  out_of_sample_sharpe_min: 1.5
  max_drawdown_percent: 12
  profitable_walk_forward_windows_percent_min: 65
  max_single_strategy_pnl_share_percent: 60
  max_cost_share_of_gross_alpha_percent: 30
  doubled_slippage_must_remain_profitable: true

# `status` is evidence maturity, never an implementation priority.
# Existing funding components are partial until they satisfy this specification's
# canonical event, OMS, replay, security, and elapsed-time acceptance gates.
