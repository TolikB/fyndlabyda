server {
    listen 8443 ssl;
    server_name _;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/control-plane-server.crt;
    ssl_certificate_key /run/secrets/control-plane-server.key;
    ssl_client_certificate /run/secrets/control-plane-client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 30s;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Client-Cert-SHA256 "";
        proxy_set_header X-Verified-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}
server {
    listen 8080;
    server_name localhost;

    location = /proxy-health {
        access_log off;
        return 204;
    }
}
