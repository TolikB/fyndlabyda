<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Funding Arbitrage Research</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    main { max-width: 1200px; margin: auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 10px; padding: 16px; }
    .label { color: #9ca3af; font-size: 12px; text-transform: uppercase; }
    .value { font-size: 24px; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 9px; border-bottom: 1px solid #374151; }
    th { color: #9ca3af; font-size: 12px; }
    .status { margin: 12px 0; color: #93c5fd; }
    .auth { display: flex; gap: 8px; max-width: 760px; }
    .auth input { flex: 1; min-width: 0; padding: 10px; border: 1px solid #4b5563; border-radius: 6px; background: #111827; color: #e5e7eb; }
    .auth button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>Funding Arbitrage Research</h1>
  <form id="auth-form" class="auth">
    <input id="access-token" type="password" autocomplete="off" spellcheck="false" placeholder="Read-only JWT access token" required>
    <button type="submit">Connect</button>
  </form>
  <div id="status" class="status">Enter a read-only JWT to load protected data.</div>
  <section class="grid">
    <div class="card"><div class="label">Equity</div><div id="equity" class="value">—</div></div>
    <div class="card"><div class="label">Cash</div><div id="cash" class="value">—</div></div>
    <div class="card"><div class="label">Locked capital</div><div id="locked" class="value">—</div></div>
    <div class="card"><div class="label">Opportunities</div><div id="count" class="value">—</div></div>
    <div class="card"><div class="label">Paper funding PnL</div><div id="funding-pnl" class="value">—</div></div>
    <div class="card"><div class="label">Paper fees</div><div id="fees" class="value">—</div></div>
  </section>
  <h2>Ranked opportunities</h2>
  <table>
    <thead><tr><th>Strategy</th><th>Asset</th><th>Venues</th><th>Net APR</th><th>Score</th><th>Status</th></tr></thead>
    <tbody id="opportunities"></tbody>
  </table>
</main>
<script>
  let accessToken = '';
  const status = document.querySelector('#status');
  const money = value => Number(value || 0).toLocaleString(undefined, {maximumFractionDigits: 2});

  async function apiFetch(path) {
    const response = await fetch(path, {
      cache: 'no-store',
      headers: {Authorization: `Bearer ${accessToken}`}
    });
    if (!response.ok) {
      if (response.status === 401) accessToken = '';
      throw new Error(`HTTP ${response.status}`);
    }
    return response.json();
  }

  function renderOpportunities(opportunities) {
    const body = document.querySelector('#opportunities');
    body.replaceChildren(...opportunities.map(item => {
      const row = document.createElement('tr');
      const values = [
        item.strategy,
        item.asset,
        `${item.venue_a}${item.venue_b ? ' ↔ ' + item.venue_b : ''}`,
        `${(Number(item.net_apr) * 100).toFixed(2)}%`,
        Number(item.opportunity_score).toFixed(1),
        item.status
      ];
      for (const value of values) {
        const cell = document.createElement('td');
        cell.textContent = String(value ?? '');
        row.appendChild(cell);
      }
      return row;
    }));
  }

  async function refresh() {
    if (!accessToken) {
      status.textContent = 'Enter a read-only JWT to load protected data.';
      return;
    }
    try {
      const [portfolio, opportunities, paper] = await Promise.all([
        apiFetch('/portfolio'),
        apiFetch('/opportunities'),
        apiFetch('/analytics/paper')
      ]);
      document.querySelector('#equity').textContent = money(portfolio.equity);
      document.querySelector('#cash').textContent = money(portfolio.cash);
      document.querySelector('#locked').textContent = money(portfolio.locked_capital);
      document.querySelector('#count').textContent = opportunities.length;
      document.querySelector('#funding-pnl').textContent = money(paper.funding_pnl);
      document.querySelector('#fees').textContent = money(paper.fees);
      renderOpportunities(opportunities);
      status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (error) {
      status.textContent = accessToken
        ? `Protected API unavailable: ${error}`
        : 'JWT was rejected or expired. Enter a new read-only token.';
    }
  }

  document.querySelector('#auth-form').addEventListener('submit', event => {
    event.preventDefault();
    const input = document.querySelector('#access-token');
    accessToken = input.value.trim();
    input.value = '';
    void refresh();
  });
  setInterval(() => void refresh(), 5000);
</script>
</body>
</html>
