# Paper-only deployment of the funding research bot.
#
# * The project name is pinned so every `docker compose` command in this directory
#   touches only this project's containers, never other projects on the VM.
# * Ports bind to 127.0.0.1; reach the API/dashboard through an SSH tunnel.
# * The database volume is new for simulator v2, so the new series never shares a
#   database with the legacy paper history (which stays in its own volume).
name: funding_arbitrage_paper

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build:
      context: .
    image: funding-arbitrage-paper:${RELEASE_TAG:-local}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://funding:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/funding
      EXECUTION_MODE: paper
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    restart: unless-stopped
    stop_grace_period: 45s
    cpus: 1.5
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Ready means the paper runner completed a cycle recently, not just that HTTP is up.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 4
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: funding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: funding
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funding -d funding"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    logging: *default-logging

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    logging: *default-logging

volumes:
  pgdata:
    name: funding_arbitrage_paper_pgdata_v2
  prometheus_data:
  grafana_data:
