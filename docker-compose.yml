x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  low-latency:
    build: .
    profiles: ["low-latency"]
    user: "10001:10001"
    init: true
    read_only: true
    command: ["funding-native-low-latency", "--listen", "0.0.0.0:9010"]
    expose:
      - "9010/udp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    cpus: "0.25"
    mem_limit: 32m
    logging: *bounded-logging
    restart: unless-stopped

  app: &paper-app
    build: .
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - runtime_state:/app/.runtime
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging: *bounded-logging
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn funding_arbitrage.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    cpus: "1.00"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=20)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s
    stop_grace_period: 90s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-funding}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cpus: "0.25"
    mem_limit: 384m
    shm_size: 128m
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funding} -d ${POSTGRES_DB:-funding}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    cpus: "0.10"
    mem_limit: 96m
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: funding_analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-funding_analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "8123"
      - "9000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: "0.50"
    mem_limit: 768m
    logging: *bounded-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    cpus: "0.10"
    mem_limit: 192m
    logging: *bounded-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    cpus: "0.20"
    mem_limit: 256m
    logging: *bounded-logging
    restart: unless-stopped

volumes:
  clickhouse_data:
  postgres_data:
  runtime_state:
