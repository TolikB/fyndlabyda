name: Release gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:
    inputs:
      live_gate_confirmation:
        description: "Type APPROVE_LIMITED_LIVE_CONFIGURATION_ONLY"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: funding-arbitrage-ci:${{ github.sha }}

jobs:
  verify:
    name: Lint, type, unit, and coverage gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: funding
          POSTGRES_PASSWORD: funding
          POSTGRES_DB: funding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funding -d funding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://funding:funding@127.0.0.1:5432/funding

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-linux.lock
            requirements-dev-linux.lock

      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev-linux.lock

      - name: Static and unit verification
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src scripts migrations
          python -m ruff check src tests scripts migrations
          python -m mypy src
          python scripts/v1_acceptance_audit.py
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage json -o coverage_report.json
          python scripts/coverage_gate.py --report coverage_report.json

      - name: Build and benchmark native low-latency gate
        run: |
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            native/low_latency/native_low_latency.c \
            -o /tmp/funding-native-low-latency
          /tmp/funding-native-low-latency --self-test 200000

      - name: Verify complete PostgreSQL migration chain
        env:
          PYTHONPATH: src
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Validate production Compose configuration
        run: |
          cp .env.paper-test.example .env
          docker compose config --quiet

  integration-replay:
    name: PostgreSQL integration, replay, and failure injection
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: funding
          POSTGRES_PASSWORD: funding
          POSTGRES_DB: funding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funding -d funding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://funding:funding@127.0.0.1:5432/funding
      PYTHONPATH: src
      RUN_POSTGRES_REPORT_CONTRACT: "1"
      RUN_POSTGRES_REPOSITORY_CONTRACT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-linux.lock

      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev-linux.lock

      - name: Run integration and deterministic replay contracts
        run: >-
          python -m pytest -q
          tests/test_migrations.py
          tests/test_market_data_repository.py
          tests/test_market_data_repository_postgres.py
          tests/test_backtest_job_persistence.py
          tests/test_backtest_routes_contract.py
          tests/test_database_replay.py
          tests/test_historical_replay.py
          tests/test_event_journal.py
          tests/test_journal_profiles.py
          tests/test_durable_oms.py
          tests/test_continuous_reconciliation.py
          tests/test_live_runner_lifecycle.py
          tests/test_daily_report_postgres.py

  load-slo:
    name: Sealed-candidate critical-path load and reliability SLO
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize load SLO diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0700 "${RUNNER_TEMP}/funding-load-slo"
          printf 'revision=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            >"${RUNNER_TEMP}/funding-load-slo/funding-load-slo-run.txt"
          : >"${RUNNER_TEMP}/funding-load-slo/funding-load-slo.log"

      - name: Download sealed candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: funding-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/funding-candidate

      - name: Verify and load exact candidate image
        run: >-
          bash scripts/ci_load_candidate_image.sh
          "${RUNNER_TEMP}/funding-candidate"
          "$CI_IMAGE"
          "$GITHUB_SHA"

      - name: Enforce P99 and reliability budgets inside the sealed candidate
        shell: bash
        run: |
          set -euo pipefail
          expected_image_id="$(tr -d '\r\n' < \
            "${RUNNER_TEMP}/funding-candidate/funding-candidate-image.id")"
          bash scripts/ci_candidate_load_slo.sh \
            "$CI_IMAGE" \
            "$expected_image_id" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT"

      - name: Set up Python 3.12 for independent evidence verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-linux.lock

      - name: Install hash-locked production dependencies for the verifier
        run: python -m pip install --require-hashes --requirement requirements-linux.lock

      - name: Strictly verify candidate evidence before attestation
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          expected_image_id="$(tr -d '\r\n' < \
            "${RUNNER_TEMP}/funding-candidate/funding-candidate-image.id")"
          python scripts/verify_load_slo_evidence.py \
            --evidence "${RUNNER_TEMP}/funding-load-slo/funding-load-slo.json" \
            --revision "$GITHUB_SHA" \
            --image-id "$expected_image_id" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload commit-bound load SLO evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: funding-load-slo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/funding-load-slo/funding-load-slo-run.txt
            ${{ runner.temp }}/funding-load-slo/funding-load-slo.log
            ${{ runner.temp }}/funding-load-slo/funding-load-slo.json
            ${{ runner.temp }}/funding-load-slo/funding-load-slo.json.sha256
          if-no-files-found: error
          retention-days: 30

  attest-load-slo:
    name: Attest successful public-repository load SLO evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: load-slo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact load SLO evidence attempt
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: funding-load-slo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/funding-load-slo

      - name: Create signed SLSA provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: |
            ${{ runner.temp }}/funding-load-slo/funding-load-slo.json
            ${{ runner.temp }}/funding-load-slo/funding-load-slo.json.sha256

  infrastructure-verify:
    name: Terraform, Vault, backup, and Linux script validation
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Terraform 1.15.9
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Validate provider-neutral Terraform
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate -no-color

      - name: Validate Linux operational scripts
        run: |
          for script in \
            scripts/ci_shadow_smoke.sh \
            scripts/ci_load_candidate_image.sh \
            scripts/ci_restore_drill.sh \
            scripts/ci_candidate_load_slo.sh \
            scripts/generate_ephemeral_test_pki.sh \
            scripts/verify_internal_tls.sh \
            scripts/backup_state.sh \
            scripts/restore_state.sh \
            scripts/stage_signed_release.sh \
            scripts/host_preflight.sh; do
            bash -n "$script"
          done

  build-candidate:
    name: Build and seal immutable candidate image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build candidate image exactly once
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/funding-candidate"
          mkdir -p "$artifact_dir"
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$CI_IMAGE" .
          image_id="$(docker image inspect --format '{{.Id}}' "$CI_IMAGE")"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$CI_IMAGE")"
          test "$revision" = "$GITHUB_SHA"
          printf '%s\n' "$image_id" >"$artifact_dir/funding-candidate-image.id"
          printf '%s\n' "$revision" >"$artifact_dir/funding-candidate-image.revision"
          printf '%s\n' "$revision" >"$artifact_dir/.release-sha"
          docker save "$CI_IMAGE" | gzip -1 >"$artifact_dir/funding-candidate-image.tar.gz"
          (
            cd "$artifact_dir"
            sha256sum funding-candidate-image.tar.gz >funding-candidate-image.tar.gz.sha256
          )

      - name: Upload sealed candidate image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: funding-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/funding-candidate
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
          compression-level: 0

  restore-drill:
    name: Encrypted PostgreSQL restore and crash-state drill
    needs:
      - verify
      - build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download sealed candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: funding-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/funding-candidate

      - name: Verify and load exact candidate image
        run: >-
          bash scripts/ci_load_candidate_image.sh
          "${RUNNER_TEMP}/funding-candidate"
          "$CI_IMAGE"
          "$GITHUB_SHA"

      - name: Install restore-drill tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Set up Python 3.12 for typed DR evidence
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-linux.lock

      - name: Install hash-locked production dependencies for DR evidence
        run: python -m pip install --require-hashes --requirement requirements-linux.lock

      - name: Initialize private DR evidence directory
        shell: bash
        run: mkdir -m 0700 "${RUNNER_TEMP}/funding-disaster-recovery"

      - name: Run encrypted restore and fault-state drill
        run: >-
          bash scripts/ci_restore_drill.sh
          "${RUNNER_TEMP}/funding-candidate"
          "$CI_IMAGE"
          "$GITHUB_SHA"
          "${RUNNER_TEMP}/funding-disaster-recovery"

      - name: Strictly verify release-bound DR evidence
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          expected_image_id="$(tr -d '\r\n' < \
            "${RUNNER_TEMP}/funding-candidate/funding-candidate-image.id")"
          python scripts/disaster_recovery_evidence.py verify \
            --evidence "${RUNNER_TEMP}/funding-disaster-recovery/funding-disaster-recovery.json" \
            --revision "$GITHUB_SHA" \
            --image-id "$expected_image_id" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"

  container-security:
    name: Dependency, image, and SBOM gates
    needs:
      - verify
      - build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download sealed candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: funding-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/funding-candidate

      - name: Verify and load exact candidate image
        run: >-
          bash scripts/ci_load_candidate_image.sh
          "${RUNNER_TEMP}/funding-candidate"
          "$CI_IMAGE"
          "$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-linux.lock

      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev-linux.lock

      - name: Audit production dependencies
        run: python -m pip_audit --requirement requirements-linux.lock --disable-pip


      - name: Scan candidate image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate immutable image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.CI_IMAGE }}
          format: spdx-json
          output-file: funding-arbitrage.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Upload immutable image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: funding-arbitrage-sbom-${{ github.sha }}
          path: funding-arbitrage.spdx.json
          if-no-files-found: error
          retention-days: 30

  attest-sbom:
    name: Keylessly sign and retain the main SBOM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable image SBOM
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: funding-arbitrage-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/funding-sbom

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Keylessly sign and verify the immutable SBOM
        shell: bash
        working-directory: ${{ runner.temp }}/funding-sbom
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-gate.yml@refs/heads/main"
          test -f funding-arbitrage.spdx.json
          cosign sign-blob --yes \
            --bundle funding-arbitrage.spdx.bundle \
            funding-arbitrage.spdx.json
          cosign verify-blob \
            --bundle funding-arbitrage.spdx.bundle \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            funding-arbitrage.spdx.json

      - name: Retain the SBOM and keyless verification bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: funding-sbom-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/funding-sbom/funding-arbitrage.spdx.json
            ${{ runner.temp }}/funding-sbom/funding-arbitrage.spdx.bundle
          if-no-files-found: error
          retention-days: 30

  shadow-deploy:
    name: Isolated shadow container smoke test
    needs:
      - verify
      - integration-replay
      - load-slo
      - infrastructure-verify
      - restore-drill
      - build-candidate
      - container-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download sealed candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: funding-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/funding-candidate

      - name: Verify and load exact candidate image
        run: >-
          bash scripts/ci_load_candidate_image.sh
          "${RUNNER_TEMP}/funding-candidate"
          "$CI_IMAGE"
          "$GITHUB_SHA"

      - name: Run isolated shadow deployment
        run: bash scripts/ci_shadow_smoke.sh "$CI_IMAGE"

  publish-signed-image:
    name: Publish and keylessly sign main image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - shadow-deploy
      - attest-load-slo
      - attest-sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download sealed candidate image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: funding-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/funding-candidate

      - name: Verify and load exact candidate image
        run: >-
          bash scripts/ci_load_candidate_image.sh
          "${RUNNER_TEMP}/funding-candidate"
          "$CI_IMAGE"
          "$GITHUB_SHA"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Publish, sign, and verify the exact gated image
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}"
          release_dir="${RUNNER_TEMP}/funding-signed-release"
          mkdir -m 0700 "$release_dir"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$CI_IMAGE" "${image}:${GITHUB_SHA}"
          docker push "${image}:${GITHUB_SHA}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${image}:${GITHUB_SHA}" | cut -d@ -f2)"
          test -n "$digest"
          image_ref="${image}@${digest}"
          cosign sign --yes "$image_ref"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-gate.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$image_ref" | tee "$release_dir/funding-release-cosign.json"
          printf '%s\n' "$image_ref" >"$release_dir/funding-release-image.txt"
          printf '%s\n' "$GITHUB_SHA" >"$release_dir/funding-release-revision.txt"
          (
            cd "$release_dir"
            sha256sum funding-release-cosign.json funding-release-image.txt \
              funding-release-revision.txt >funding-release-files.sha256
          )

      - name: Upload exact signed release pointer and verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: funding-signed-release-${{ github.sha }}
          path: ${{ runner.temp }}/funding-signed-release
          if-no-files-found: error
          retention-days: 30

  manual-live-gate:
    name: Protected limited-live configuration approval
    if: github.event_name == 'workflow_dispatch'
    needs: shadow-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: limited-live-approval
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-linux.lock

      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev-linux.lock

      - name: Bind full V1 completion evidence to this commit
        id: v1-prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v1_acceptance_audit.py \
            --manifest config/v1_acceptance.yaml \
            --require-release-prerequisites \
            --expected-revision "$GITHUB_SHA" \
            | tee "${RUNNER_TEMP}/funding-v1-prerequisites.json"

      - name: Verify protected manual gate preconditions
        id: limited-live-gate
        env:
          LIVE_GATE_CONFIRMATION: ${{ inputs.live_gate_confirmation }}
          LIVE_GATE_ENVIRONMENT: limited-live-approval
        run: >-
          python scripts/manual_live_gate.py
          --manifest config/v1_acceptance.yaml
          --output "${RUNNER_TEMP}/funding-limited-live-approval.json"

      - name: Attest protected approval evidence
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: |
            ${{ runner.temp }}/funding-v1-prerequisites.json
            ${{ runner.temp }}/funding-limited-live-approval.json
            ${{ runner.temp }}/funding-limited-live-approval.json.sha256

      - name: Retain immutable protected approval evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: funding-limited-live-approval-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/funding-v1-prerequisites.json
            ${{ runner.temp }}/funding-limited-live-approval.json
            ${{ runner.temp }}/funding-limited-live-approval.json.sha256
          if-no-files-found: error
          retention-days: 90
