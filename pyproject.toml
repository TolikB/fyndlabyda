[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "funding-arbitrage"
version = "0.1.0"
description = "Paper-first market-neutral funding arbitrage bot with guarded live execution"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "ccxt>=4.5,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "protobuf==5.29.6",
  "pyarrow>=21,<24",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6.0,<7",
  "redis>=5.0,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tzdata>=2024.1,<2027",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "coverage==7.15.2",
  "mypy>=1.11,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
  "pre-commit>=3.7,<5",
]
analytics = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
]

[project.scripts]
funding-arbitrage = "funding_arbitrage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["funding_arbitrage"]

[tool.coverage.report]
show_missing = true
skip_covered = true
